$kind: http-request
url: "{{baseUrl}}/api/orders/analytics/summary?startDate=2024-01-01&endDate=2024-12-31"
method: GET
headers:
  Authorization: Bearer {{managerToken}}
queryParams:
  startDate: 2024-01-01
  endDate: 2024-12-31
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response has analytics data", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData).to.have.property('totalOrders');
          pm.expect(jsonData).to.have.property('totalRevenue');
      });
    language: text/javascript
order: 8000
