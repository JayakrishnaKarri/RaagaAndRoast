$kind: http-request
url: "{{baseUrl}}/api/orders/history?page=0&size=20&sort=createdAt,desc"
method: GET
headers:
  Authorization: Bearer {{customerToken}}
queryParams:
  page: "0"
  size: "20"
  sort: createdAt,desc
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response has order history", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData).to.have.property('content');
      });
    language: text/javascript
order: 12000
