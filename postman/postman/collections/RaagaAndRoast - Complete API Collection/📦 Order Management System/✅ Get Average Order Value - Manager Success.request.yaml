$kind: http-request
url: "{{baseUrl}}/api/orders/analytics/average-value"
method: GET
headers:
  Authorization: Bearer {{managerToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response has average order value", function () {
          var jsonData = pm.response.json();
          pm.expect(typeof jsonData).to.equal('number');
          pm.expect(jsonData).to.be.at.least(0);
      });
    language: text/javascript
order: 27000
