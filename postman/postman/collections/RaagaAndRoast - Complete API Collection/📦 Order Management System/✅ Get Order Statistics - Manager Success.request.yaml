$kind: http-request
url: "{{baseUrl}}/api/orders/analytics/statistics"
method: GET
headers:
  Authorization: Bearer {{managerToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response has order statistics", function () {
          var jsonData = pm.response.json();
          pm.expect(Array.isArray(jsonData)).to.be.true;
          // Statistics are returned as array of Object[] from repository
      });
    language: text/javascript
order: 25000
