$kind: http-request
url: "{{baseUrl}}/api/orders/{{orderId}}/ownership"
method: GET
headers:
  Authorization: Bearer {{customerToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response has ownership status", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData).to.have.property('isOwner');
      });
    language: text/javascript
order: 20000
