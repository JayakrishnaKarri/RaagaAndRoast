$kind: http-request
url: "{{baseUrl}}/api/addresses/customer/{{customerId}}/has-addresses"
method: GET
headers:
  Authorization: Bearer {{staffToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response has boolean result", function () {
          var jsonData = pm.response.json();
          pm.expect(typeof jsonData).to.equal('boolean');
      });
    language: text/javascript
order: 33000
