$kind: http-request
url: "{{baseUrl}}/api/addresses/customer/{{customerId}}/count"
method: GET
headers:
  Authorization: Bearer {{staffToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response has address count", function () {
          var jsonData = pm.response.json();
          pm.expect(typeof jsonData).to.equal('number');
          pm.expect(jsonData).to.be.at.least(0);
      });
    language: text/javascript
order: 35000
