$kind: http-request
name: ✅ Get All Addresses - Admin Success
url: "{{baseUrl}}/api/addresses/admin/all?page=0&size=20&sort=createdAt,desc"
method: GET
headers:
  Authorization: Bearer {{adminToken}}
queryParams:
  page: "0"
  size: "20"
  sort: createdAt,desc
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response has all addresses", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData).to.have.property('content');
          pm.expect(jsonData).to.have.property('totalElements');
      });
    language: text/javascript
order: 29000
