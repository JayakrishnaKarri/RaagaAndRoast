$kind: http-request
url: "{{baseUrl}}/api/addresses"
method: POST
headers:
  Authorization: Bearer {{customerToken}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
        "street": "123 Main Street",
        "city": "New York",
        "state": "NY",
        "postalCode": "10001",
        "country": "USA",
        "type": "HOME",
        "isDefault": true,
        "deliveryInstructions": "Ring the doorbell twice"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 201", function () {
          pm.response.to.have.status(201);
      });

      pm.test("Address created successfully", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData).to.have.property('id');
          pm.expect(jsonData).to.have.property('street');
          pm.expect(jsonData).to.have.property('city');
          pm.expect(jsonData).to.have.property('type');
          
          // Store address ID for subsequent requests
          pm.environment.set('addressId', jsonData.id);
      });
    language: text/javascript
order: 1000
