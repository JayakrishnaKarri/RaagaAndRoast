$kind: http-request
url: "{{baseUrl}}/api/addresses/{{addressIdToDelete}}"
method: DELETE
headers:
  Authorization: Bearer {{customerToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 204", function () {
          pm.response.to.have.status(204);
      });
    language: text/javascript
order: 5000
