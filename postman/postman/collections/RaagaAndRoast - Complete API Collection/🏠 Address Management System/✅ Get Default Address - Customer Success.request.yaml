$kind: http-request
url: "{{baseUrl}}/api/addresses/default"
method: GET
headers:
  Authorization: Bearer {{customerToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response has default address", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData).to.have.property('isDefault');
          pm.expect(jsonData.isDefault).to.be.true;
      });
    language: text/javascript
order: 8000
