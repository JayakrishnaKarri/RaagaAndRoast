$kind: http-request
url: "{{baseUrl}}/api/customers/{{customerId}}/cart/summary"
method: GET
headers:
  Authorization: Bearer {{staffToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Staff can access customer cart summary", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData).to.have.property('totalItems');
          pm.expect(jsonData).to.have.property('totalAmount');
      });
    language: text/javascript
order: 13000
