$kind: http-request
url: "{{baseUrl}}/api/customers/{{customerId}}/cart/summary"
method: GET
headers:
  Authorization: Bearer {{customerToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response has cart summary", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData).to.have.property('totalItems');
          pm.expect(jsonData).to.have.property('totalAmount');
          pm.expect(jsonData).to.have.property('itemCount');
      });
    language: text/javascript
order: 9000
