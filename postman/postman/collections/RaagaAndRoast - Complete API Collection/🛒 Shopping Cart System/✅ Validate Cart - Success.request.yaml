$kind: http-request
url: "{{baseUrl}}/api/customers/{{customerId}}/cart/validate"
method: POST
headers:
  Authorization: Bearer {{customerToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Cart validation response", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData).to.have.property('valid');
          pm.expect(jsonData).to.have.property('issues');
      });
    language: text/javascript
order: 6000
