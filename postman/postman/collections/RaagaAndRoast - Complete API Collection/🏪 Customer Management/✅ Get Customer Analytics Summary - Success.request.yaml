$kind: http-request
url: "{{baseUrl}}/api/customers/analytics/summary"
method: GET
headers:
  Authorization: Bearer {{managerToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response has analytics data", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData).to.have.property('totalCustomers');
          pm.expect(jsonData).to.have.property('activeCustomers');
      });
    language: text/javascript
order: 3000
