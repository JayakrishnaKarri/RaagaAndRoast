$kind: http-request
url: "{{baseUrl}}/api/customers/statistics/marketing-consent"
method: GET
headers:
  Authorization: Bearer {{managerToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response has marketing consent statistics", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData).to.have.property('consentedCount');
          pm.expect(jsonData).to.have.property('notConsentedCount');
          pm.expect(jsonData).to.have.property('totalCount');
      });
    language: text/javascript
order: 24000
