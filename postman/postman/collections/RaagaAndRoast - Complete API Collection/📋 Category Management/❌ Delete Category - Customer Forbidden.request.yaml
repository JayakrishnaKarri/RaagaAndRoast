$kind: http-request
url: "{{baseUrl}}/api/categories/{{categoryId}}"
method: DELETE
headers:
  Authorization: Bearer {{customerToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 403", function () {
          pm.response.to.have.status(403);
      });
    language: text/javascript
order: 12000
