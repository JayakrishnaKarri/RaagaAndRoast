$kind: http-request
url: "{{baseUrl}}/api/categories/{{categoryId}}"
method: PUT
headers:
  Authorization: Bearer {{managerToken}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
        "name": "Beverages Updated",
        "description": "Updated description for beverages category",
        "active": true
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Category updated successfully", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData).to.have.property('name');
          pm.expect(jsonData.description).to.include('Updated');
      });
    language: text/javascript
order: 5000
