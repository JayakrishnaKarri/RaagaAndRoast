$kind: http-request
url: "{{baseUrl}}/api/menu-items/{{menuItemIdToDelete}}"
method: DELETE
headers:
  Authorization: Bearer {{managerToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 204", function () {
          pm.response.to.have.status(204);
      });
    language: text/javascript
order: 13000
