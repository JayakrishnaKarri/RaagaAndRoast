$kind: http-request
url: "{{baseUrl}}/api/menu-items/price-range?minPrice=2.00&maxPrice=5.00&page=0&size=20"
method: GET
headers:
  Authorization: Bearer {{customerToken}}
queryParams:
  minPrice: "2.00"
  maxPrice: "5.00"
  page: "0"
  size: "20"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response has price filtered items", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData).to.have.property('content');
      });
    language: text/javascript
order: 9000
