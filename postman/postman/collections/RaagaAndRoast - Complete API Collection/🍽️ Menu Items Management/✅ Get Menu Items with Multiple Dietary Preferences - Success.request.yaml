$kind: http-request
url: "{{baseUrl}}/api/menu-items/dietary?vegetarian=true&glutenFree=true&availableOnly=true&page=0&size=20"
method: GET
headers:
  Authorization: Bearer {{customerToken}}
queryParams:
  vegetarian: "true"
  glutenFree: "true"
  availableOnly: "true"
  page: "0"
  size: "20"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response has items matching multiple dietary preferences", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData).to.have.property('content');
      });
    language: text/javascript
order: 16000
